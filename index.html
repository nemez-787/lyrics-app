<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводы Песен и Альбомы</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #d1d5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f2937;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-left {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background-color: #1e293b;
            color: #60a5fa;
            border: 1px solid #3b82f6;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .btn:hover { background-color: #3b82f6; color: #fff; }
        .btn-secondary {
            background-color: #0f172a;
            color: #94a3b8;
            border-color: #334155;
        }
        .btn-secondary:hover {
            background-color: #1e293b;
            color: #f8fafc;
        }
        .btn-danger {
            background-color: #450a0a;
            color: #f87171;
            border-color: #991b1b;
        }
        .btn-danger:hover {
            background-color: #991b1b;
            color: #fff;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 24px;
            color: #f3f4f6;
            text-align: center;
            flex: 1;
        }

        .artist-grid, .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .card {
            background: #000;
            border: 2px solid #1d4ed8;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
        }
        .card-cover {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background-color: #050b14;
        }
        .card-title-bar {
            background-color: #030712;
            color: #3b82f6;
            padding: 9px 5px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1px solid #1d4ed8;
        }

        .card-edit-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card:hover .card-edit-btn { opacity: 1; }
        .card-edit-btn:hover { background: #3b82f6; color: #fff; }

        .tracklist-container {
            display: flex;
            gap: 30px;
            background: #000;
            border: 1px solid #1f2937;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        @media (max-width: 650px) {
            .tracklist-container { flex-direction: column; }
        }
        .tracklist-cover {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 2px solid #3b82f6;
            border-radius: 4px;
        }
        .tracklist-info { flex: 1; }
        .tracklist-title { font-size: 26px; color: #fff; margin-bottom: 15px; }
        .tracks-ol { padding-left: 20px; }
        .track-item {
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 10px;
        }
        .track-link {
            color: #60a5fa;
            text-decoration: none;
            cursor: pointer;
        }
        .track-link:hover { text-decoration: underline; color: #93c5fd; }
        .track-actions { display: flex; gap: 8px; }
        .stream-btn {
            margin-top: 20px;
            background: #1d4ed8;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .lyrics-container {
            background: #111827;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .lyrics-header { margin-bottom: 20px; border-bottom: 1px solid #374151; padding-bottom: 15px; }
        .lyric-line-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 8px 12px;
            border-radius: 4px;
        }
        @media (max-width: 600px) {
            .lyric-line-pair { grid-template-columns: 1fr; }
        }
        .lyric-line-pair:hover { background-color: #1f2937; }
        .orig-text { color: #f3f4f6; font-weight: 500; }
        .trans-text { color: #60a5fa; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1f2937;
            padding: 25px;
            border-radius: 8px;
            width: 520px;
            max-width: 90%;
            border: 1px solid #3b82f6;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 15px; color: #fff; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #9ca3af; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 10px;
            background: #111827;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .modal-buttons-right { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="nav-left">
            <button class="btn btn-secondary" onclick="showArtistsView()">🏠 Исполнители</button>
        </div>
        
        <!-- Кнопки импорта/экспорта данных -->
        <button class="btn btn-secondary" onclick="exportData()">💾 Скачать данные</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Загрузить данные</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">

        <button class="btn" onclick="openArtistModal()">+ Добавить исполнителя</button>
        <button class="btn" onclick="openAlbumModal()">+ Добавить альбом</button>
        <button class="btn" onclick="openSongModal()">+ Добавить песню</button>
    </header>

    <div id="artistsView">
        <h2 class="section-title" style="margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 10px;">Исполнители</h2>
        <div class="artist-grid" id="artistGrid"></div>
    </div>

    <div id="artistAlbumsView" style="display:none;">
        <div class="section-header">
            <h2 class="section-title" id="artistTitleHeader">Альбомы</h2>
            <button class="btn btn-secondary" id="editCurrentArtistBtn" style="display:none;">✏️ Редактировать группу</button>
        </div>
        <div class="album-grid" id="albumGrid"></div>
    </div>

    <div id="tracklistView" style="display:none;"></div>
    <div id="lyricsView" style="display:none;"></div>
</div>

<!-- Modal Artist -->
<div class="modal" id="artistModal">
    <div class="modal-content">
        <h3 id="artistModalTitle">Добавить исполнителя</h3>
        <input type="hidden" id="editArtistId">
        <div class="form-group">
            <label>Имя / Название группы</label>
            <input type="text" id="artistNameInput" placeholder="например, Slayer">
        </div>
        <div class="form-group">
            <label>Ссылка на фото / логотип (URL)</label>
            <input type="text" id="artistImageInput" placeholder="https://example.com/logo.jpg">
        </div>
        <div class="modal-buttons">
            <button class="btn btn-danger" id="deleteArtistBtn" style="display:none;" onclick="deleteArtist()">Удалить группу</button>
            <div class="modal-buttons-right" style="margin-left: auto;">
                <button class="btn btn-secondary" onclick="closeModal('artistModal')">Отмена</button>
                <button class="btn" onclick="saveArtist()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Album -->
<div class="modal" id="albumModal">
    <div class="modal-content">
        <h3 id="albumModalTitle">Добавить новый альбом</h3>
        <input type="hidden" id="editAlbumId">
        <div class="form-group">
            <label>Исполнитель</label>
            <select id="albArtistSelect"></select>
        </div>
        <div class="form-group">
            <label>Название альбома</label>
            <input type="text" id="albNameInput" placeholder="например, Master of Puppets">
        </div>
        <div class="form-group">
            <label>Год выпуска</label>
            <input type="text" id="albYearInput" placeholder="1986">
        </div>
        <div class="form-group">
            <label>Ссылка на обложку (URL)</label>
            <input type="text" id="albCoverInput" placeholder="https://example.com/cover.jpg">
        </div>
        <div class="modal-buttons">
            <button class="btn btn-danger" id="deleteAlbumBtn" style="display:none;" onclick="deleteAlbum()">Удалить альбом</button>
            <div class="modal-buttons-right" style="margin-left: auto;">
                <button class="btn btn-secondary" onclick="closeModal('albumModal')">Отмена</button>
                <button class="btn" onclick="saveAlbum()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Song -->
<div class="modal" id="songModal">
    <div class="modal-content">
        <h3 id="songModalTitle">Добавить песню и перевод</h3>
        <input type="hidden" id="editSongAlbId">
        <input type="hidden" id="editSongIndex">
        <div class="form-group" id="songAlbumSelectGroup">
            <label>Выберите альбом</label>
            <select id="songAlbumSelect"></select>
        </div>
        <div class="form-group">
            <label>Название песни</label>
            <input type="text" id="songTitleInput" placeholder="Disposable Heroes">
        </div>
        <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <label style="margin:0;">Английский текст (построчно)</label>
                <button class="btn btn-secondary" id="autoTranslateBtn" style="padding: 2px 8px; font-size:12px;" onclick="autoTranslateLyrics()">⚡ Автоперевод</button>
            </div>
            <textarea id="songLyricsEngInput" rows="5" placeholder="Bodies fill the fields I see..."></textarea>
        </div>
        <div class="form-group">
            <label>Русский перевод (построчно)</label>
            <textarea id="songLyricsRusInput" rows="5" placeholder="Тела заполняют поля, что я вижу..."></textarea>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-danger" id="deleteSongBtn" style="display:none;" onclick="deleteSong()">Удалить песню</button>
            <div class="modal-buttons-right" style="margin-left: auto;">
                <button class="btn btn-secondary" onclick="closeModal('songModal')">Отмена</button>
                <button class="btn" onclick="saveSong()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

          "rus": "В ловушке чистилища\nБезжизненный предмет, живой\nОжидание расправы\nСмерть будет их оправданием\nНебо становится красным\nВозвращение к власти приближается\nПадайте в меня, малиновые слезы неба\nОтмените правила, сделанные из камня\nПронзенные снизу души моего коварного прошлого\nПреданный многими\nТеперь украшения капают выше\nОжидая часа расправы\nВаше время ускользает\nДождь крови\nИз разорванного неба\nКровотечение его ужаса\nСоздаю свою структуру\nТеперь я буду править в крови"
        }

    }

};

    let artists = JSON.parse(localStorage.getItem('musinfo_artists')) || defaultArtists;
    let albums = JSON.parse(localStorage.getItem('musinfo_albums')) || defaultAlbums;
    let currentArtistId = null;

    function saveToStorage() {
        localStorage.setItem('musinfo_artists', JSON.stringify(artists));
        localStorage.setItem('musinfo_albums', JSON.stringify(albums));
    }

    // --- ИМПОРТ И ЭКСПОРТ ФАЙЛА ДАННЫХ ---
    function exportData() {
        const data = { artists, albums };
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'music_data.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.artists && importedData.albums) {
                    artists = importedData.artists;
                    albums = importedData.albums;
                    saveToStorage();
                    showArtistsView();
                    alert('Данные успешно импортированы!');
                } else {
                    alert('Неверный формат файла данных');
                }
            } catch (err) {
                alert('Ошибка чтения файла');
            }
        };
        reader.readAsText(file);
    }

    function hideAllViews() {
        document.getElementById('artistsView').style.display = 'none';
        document.getElementById('artistAlbumsView').style.display = 'none';
        document.getElementById('tracklistView').style.display = 'none';
        document.getElementById('lyricsView').style.display = 'none';
    }

    function showArtistsView() {
        hideAllViews();
        document.getElementById('artistsView').style.display = 'block';
        renderArtists();
    }

    function showArtistAlbumsView(artistId) {
        currentArtistId = artistId;
        const artist = artists.find(a => a.id === artistId);
        if (!artist) return showArtistsView();

        hideAllViews();
        document.getElementById('artistAlbumsView').style.display = 'block';
        document.getElementById('artistTitleHeader').innerText = `${artist.name} Альбомы`;
        
        const editBtn = document.getElementById('editCurrentArtistBtn');
        editBtn.style.display = 'inline-flex';
        editBtn.onclick = () => openArtistModal(artistId);

        renderAlbums(artistId);
    }

    function renderArtists() {
        const grid = document.getElementById('artistGrid');
        grid.innerHTML = '';
        artists.forEach(art => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = (e) => {
                if (e.target.classList.contains('card-edit-btn')) return;
                showArtistAlbumsView(art.id);
            };
            card.innerHTML = `
                <button class="card-edit-btn" onclick="openArtistModal('${art.id}')">✏️ Ред.</button>
                <img src="${art.image}" class="card-cover" alt="${art.name}" onerror="this.src='https://via.placeholder.com/300/000000/3b82f6?text=${encodeURIComponent(art.name)}'">
                <div class="card-title-bar">${art.name}</div>
            `;
            grid.appendChild(card);
        });
    }

    function renderAlbums(artistId) {
        const grid = document.getElementById('albumGrid');
        grid.innerHTML = '';
        const artistAlbums = albums.filter(a => a.artistId === artistId);

        if (artistAlbums.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7280; padding: 40px;">В этой группе пока нет альбомов. Нажмите "+ Добавить альбом".</div>`;
            return;
        }

        artistAlbums.forEach(alb => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = (e) => {
                if (e.target.classList.contains('card-edit-btn')) return;
                openAlbum(alb.id);
            };
            card.innerHTML = `
                <button class="card-edit-btn" onclick="openAlbumModal('${alb.id}')">✏️ Ред.</button>
                <img src="${alb.cover}" class="card-cover" alt="${alb.title}" onerror="this.src='https://via.placeholder.com/300/000000/3b82f6?text=No+Cover'">
                <div class="card-title-bar">${alb.title} [${alb.year}]</div>
            `;
            grid.appendChild(card);
        });
    }

    function openAlbum(id) {
        const alb = albums.find(a => a.id === id);
        const artist = artists.find(a => a.id === alb.artistId);
        if (!alb) return;

        hideAllViews();
        const tv = document.getElementById('tracklistView');
        tv.style.display = 'flex';

        let tracksHtml = alb.tracks && alb.tracks.length > 0 
            ? alb.tracks.map((t, idx) => `
                <li class="track-item">
                    <a class="track-link" onclick="openLyrics('${alb.id}', ${idx})">${t.title}</a>
                    <div class="track-actions">
                        <button class="btn btn-secondary" style="padding:2px 8px; font-size:12px;" onclick="openSongModal('${alb.id}', ${idx})">✏️</button>
                    </div>
                </li>
            `).join('')
            : '<p style="color:#6b7280; margin-bottom: 15px;">Нет добавленных песен</p>';

        tv.innerHTML = `
            <div>
                <img src="${alb.cover}" class="tracklist-cover" onerror="this.src='https://via.placeholder.com/300/000000/3b82f6?text=No+Cover'">
                <div style="margin-top: 15px; display:flex; flex-direction:column; gap:8px;">
                    <button class="btn" style="width:100%; justify-content:center;" onclick="openAlbumModal('${alb.id}')">✏️ Редактировать альбом</button>
                    <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="showArtistAlbumsView('${alb.artistId}')">← Назад к альбомам</button>
                </div>
            </div>
            <div class="tracklist-info">
                <h2 class="tracklist-title">${artist ? artist.name : ''} — ${alb.title}</h2>
                <ol class="tracks-ol">${tracksHtml}</ol>
                <button class="stream-btn">📻 Включить Музыкальный Стриминг</button>
            </div>
        `;
    }

    function openLyrics(albId, trackIdx) {
        const alb = albums.find(a => a.id === albId);
        const artist = artists.find(a => a.id === alb.artistId);
        const track = alb.tracks[trackIdx];

        hideAllViews();
        const lv = document.getElementById('lyricsView');
        lv.style.display = 'block';

        const engLines = (track.eng || '').split('\n');
        const rusLines = (track.rus || '').split('\n');

        let lyricsHtml = '';
        const maxLen = Math.max(engLines.length, rusLines.length);

        for (let i = 0; i < maxLen; i++) {
            lyricsHtml += `
                <div class="lyric-line-pair">
                    <div class="orig-text">${engLines[i] || ''}</div>
                    <div class="trans-text">${rusLines[i] ? '[Русский] ' + rusLines[i] : ''}</div>
                </div>
            `;
        }

        lv.innerHTML = `
            <div class="lyrics-header">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <h2>${artist ? artist.name : ''} — ${track.title}</h2>
                        <p style="color:#9ca3af; margin-top: 5px;">Альбом: ${alb.title} (${alb.year})</p>
                    </div>
                    <button class="btn btn-secondary" onclick="openSongModal('${alb.id}', ${trackIdx})">✏️ Редактировать текст</button>
                </div>
                <button class="btn btn-secondary" style="margin-top:12px;" onclick="openAlbum('${alb.id}')">← К треклисту</button>
            </div>
            <div>${lyricsHtml}</div>
        `;
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function openArtistModal(artistId = null) {
        const modal = document.getElementById('artistModal');
        const title = document.getElementById('artistModalTitle');
        const delBtn = document.getElementById('deleteArtistBtn');
        
        if (artistId) {
            const art = artists.find(a => a.id === artistId);
            title.innerText = 'Редактировать исполнителя';
            document.getElementById('editArtistId').value = art.id;
            document.getElementById('artistNameInput').value = art.name;
            document.getElementById('artistImageInput').value = art.image;
            delBtn.style.display = 'inline-flex';
        } else {
            title.innerText = 'Добавить исполнителя';
            document.getElementById('editArtistId').value = '';
            document.getElementById('artistNameInput').value = '';
            document.getElementById('artistImageInput').value = '';
            delBtn.style.display = 'none';
        }
        modal.style.display = 'flex';
    }

    function saveArtist() {
        const id = document.getElementById('editArtistId').value;
        const name = document.getElementById('artistNameInput').value.trim();
        const image = document.getElementById('artistImageInput').value.trim();

        if (!name) return alert('Введите название исполнителя');

        if (id) {
            const art = artists.find(a => a.id === id);
            if (art) {
                art.name = name;
                art.image = image || art.image;
            }
        } else {
            const newArt = {
                id: 'art_' + Date.now(),
                name: name,
                image: image || 'https://via.placeholder.com/300/000000/3b82f6?text=' + encodeURIComponent(name)
            };
            artists.push(newArt);
        }

        saveToStorage();
        closeModal('artistModal');
        if (currentArtistId) showArtistAlbumsView(currentArtistId);
        else showArtistsView();
    }

    function deleteArtist() {
        const id = document.getElementById('editArtistId').value;
        if (!id || !confirm('Удалить этого исполнителя и все его альбомы?')) return;

        artists = artists.filter(a => a.id !== id);
        albums = albums.filter(a => a.artistId !== id);
        saveToStorage();
        closeModal('artistModal');
        showArtistsView();
    }

    function openAlbumModal(albumId = null) {
        const modal = document.getElementById('albumModal');
        const title = document.getElementById('albumModalTitle');
        const delBtn = document.getElementById('deleteAlbumBtn');
        const select = document.getElementById('albArtistSelect');

        select.innerHTML = artists.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

        if (albumId) {
            const alb = albums.find(a => a.id === albumId);
            title.innerText = 'Редактировать альбом';
            document.getElementById('editAlbumId').value = alb.id;
            select.value = alb.artistId;
            document.getElementById('albNameInput').value = alb.title;
            document.getElementById('albYearInput').value = alb.year;
            document.getElementById('albCoverInput').value = alb.cover;
            delBtn.style.display = 'inline-flex';
        } else {
            title.innerText = 'Добавить новый альбом';
            document.getElementById('editAlbumId').value = '';
            if (currentArtistId) select.value = currentArtistId;
            document.getElementById('albNameInput').value = '';
            document.getElementById('albYearInput').value = '';
            document.getElementById('albCoverInput').value = '';
            delBtn.style.display = 'none';
        }
        modal.style.display = 'flex';
    }

    function saveAlbum() {
        const id = document.getElementById('editAlbumId').value;
        const artistId = document.getElementById('albArtistSelect').value;
        const title = document.getElementById('albNameInput').value.trim();
        const year = document.getElementById('albYearInput').value.trim();
        const cover = document.getElementById('albCoverInput').value.trim();

        if (!title) return alert('Введите название альбома');

        if (id) {
            const alb = albums.find(a => a.id === id);
            if (alb) {
                alb.artistId = artistId;
                alb.title = title;
                alb.year = year || alb.year;
                alb.cover = cover || alb.cover;
            }
        } else {
            const newAlb = {
                id: 'alb_' + Date.now(),
                artistId: artistId,
                title: title,
                year: year || '2024',
                cover: cover || 'https://via.placeholder.com/300/000000/3b82f6?text=' + encodeURIComponent(title),
                tracks: []
            };
            albums.push(newAlb);
        }

        saveToStorage();
        closeModal('albumModal');
        showArtistAlbumsView(artistId);
    }

    function deleteAlbum() {
        const id = document.getElementById('editAlbumId').value;
        if (!id || !confirm('Вы уверены, что хотите удалить этот альбом?')) return;

        const alb = albums.find(a => a.id === id);
        const artId = alb ? alb.artistId : currentArtistId;

        albums = albums.filter(a => a.id !== id);
        saveToStorage();
        closeModal('albumModal');
        showArtistAlbumsView(artId);
    }

    function openSongModal(albumId = null, trackIndex = null) {
        const modal = document.getElementById('songModal');
        const title = document.getElementById('songModalTitle');
        const delBtn = document.getElementById('deleteSongBtn');
        const selectGroup = document.getElementById('songAlbumSelectGroup');
        const select = document.getElementById('songAlbumSelect');

        if (trackIndex !== null && albumId) {
            const alb = albums.find(a => a.id === albumId);
            const track = alb.tracks[trackIndex];
            title.innerText = 'Редактировать песню';
            document.getElementById('editSongAlbId').value = albumId;
            document.getElementById('editSongIndex').value = trackIndex;
            document.getElementById('songTitleInput').value = track.title;
            document.getElementById('songLyricsEngInput').value = track.eng || '';
            document.getElementById('songLyricsRusInput').value = track.rus || '';
            selectGroup.style.display = 'none';
            delBtn.style.display = 'inline-flex';
        } else {
            title.innerText = 'Добавить песню и перевод';
            document.getElementById('editSongAlbId').value = '';
            document.getElementById('editSongIndex').value = '';
            select.innerHTML = albums.map(a => {
                const art = artists.find(ar => ar.id === a.artistId);
                return `<option value="${a.id}">${art ? art.name : ''} - ${a.title}</option>`;
            }).join('');
            if (albumId) select.value = albumId;
            document.getElementById('songTitleInput').value = '';
            document.getElementById('songLyricsEngInput').value = '';
            document.getElementById('songLyricsRusInput').value = '';
            selectGroup.style.display = 'block';
            delBtn.style.display = 'none';
        }
        modal.style.display = 'flex';
    }

    function saveSong() {
        const editAlbId = document.getElementById('editSongAlbId').value;
        const editIndex = document.getElementById('editSongIndex').value;
        const title = document.getElementById('songTitleInput').value.trim();
        const eng = document.getElementById('songLyricsEngInput').value;
        const rus = document.getElementById('songLyricsRusInput').value;

        if (!title) return alert('Введите название песни');

        let targetAlbId = editAlbId || document.getElementById('songAlbumSelect').value;
        const alb = albums.find(a => a.id === targetAlbId);

        if (alb) {
            if (editIndex !== '') {
                alb.tracks[parseInt(editIndex)] = { title, eng, rus };
            } else {
                alb.tracks.push({ title, eng, rus });
            }
            saveToStorage();
            closeModal('songModal');
            openAlbum(targetAlbId);
        }
    }

    function deleteSong() {
        const albId = document.getElementById('editSongAlbId').value;
        const index = document.getElementById('editSongIndex').value;
        if (index === '' || !confirm('Удалить эту песню?')) return;

        const alb = albums.find(a => a.id === albId);
        if (alb) {
            alb.tracks.splice(parseInt(index), 1);
            saveToStorage();
            closeModal('songModal');
            openAlbum(albId);
        }
    }

    async function autoTranslateLyrics() {
        const engText = document.getElementById('songLyricsEngInput').value.trim();
        const btn = document.getElementById('autoTranslateBtn');
        if (!engText) return alert('Сначала введите английский текст песни');

        btn.innerText = '⏳ Перевод...';
        btn.disabled = true;

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(engText)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            let translatedText = '';
            if (data && data[0]) {
                translatedText = data[0].map(item => item[0]).join('');
            }
            
            document.getElementById('songLyricsRusInput').value = translatedText;
        } catch (err) {
            alert('Ошибка при выполнении автоперевода. Проверьте интернет-соединение.');
            console.error(err);
        } finally {
            btn.innerText = '⚡ Автоперевод';
            btn.disabled = false;
        }
    }

    showArtistsView();
</script>
