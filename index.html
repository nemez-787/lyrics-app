<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Info Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .draggable-item {
            cursor: grab;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item.dragging {
            opacity: 0.4;
            border: 2px dashed #3b82f6;
        }
        .drag-over {
            border-top: 3px solid #3b82f6 !important;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #161b22;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div>
        <header class="bg-[#161b22] border-b border-[#30363d] sticky top-0 z-40 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <button id="navHomeBtn" onclick="showArtistList()" class="px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] text-white rounded-lg border border-[#30363d] text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-house text-blue-400"></i> Исполнители
                    </button>
                    <span id="breadcrumb" class="text-sm text-gray-400 hidden sm:inline"></span>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="exportData()" class="px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] text-gray-200 rounded-lg border border-[#30363d] text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk text-emerald-400"></i> Скачать данные
                    </button>
                    <label class="px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] text-gray-200 rounded-lg border border-[#30363d] text-xs font-medium transition cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-folder-open text-amber-400"></i> Загрузить данные
                        <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
                    </label>
                    
                    <button onclick="openArtistModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Исполнитель
                    </button>
                    <button onclick="openAlbumModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Альбом
                    </button>
                    <button onclick="openTrackModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Песня
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- Dynamic view containers -->
            <div id="artistsView" class="space-y-6"></div>
            <div id="albumsView" class="space-y-6 hidden"></div>
            <div id="tracksView" class="space-y-6 hidden"></div>
        </main>
    </div>

    <!-- Artist Modal -->
    <div id="artistModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-blue-400"></i> Добавить исполнителя
            </h3>
            <form onsubmit="saveArtist(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Имя / Название группы</label>
                    <input type="text" id="artistNameInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Ссылка на логотип/фото (URL)</label>
                    <input type="url" id="artistImageInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModals()" class="px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-gray-300 rounded-lg text-xs font-medium">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Album Modal -->
    <div id="albumModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-compact-disc text-blue-400"></i> Добавить альбом
            </h3>
            <form onsubmit="saveAlbum(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Исполнитель</label>
                    <select id="albumArtistSelect" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Название альбома</label>
                    <input type="text" id="albumTitleInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Год выпуска</label>
                    <input type="number" id="albumYearInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Ссылка на обложку (URL)</label>
                    <input type="url" id="albumCoverInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModals()" class="px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-gray-300 rounded-lg text-xs font-medium">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Track Modal -->
    <div id="trackModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-music text-blue-400"></i> Добавить песню
            </h3>
            <form onsubmit="saveTrack(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Выберите альбом</label>
                    <select id="trackAlbumSelect" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Название песни</label>
                    <input type="text" id="trackTitleInput" required class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Оригинальный текст</label>
                        <textarea id="trackEngInput" rows="6" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-xs text-white focus:border-blue-500 outline-none font-mono"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Перевод текста</label>
                        <textarea id="trackRusInput" rows="6" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg p-2.5 text-xs text-white focus:border-blue-500 outline-none font-mono"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModals()" class="px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-gray-300 rounded-lg text-xs font-medium">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="border-t border-[#30363d] py-4 text-center text-xs text-gray-500 bg-[#0d1117]">
        Music Info Library &copy; 2026. Поддержка Drag-and-Drop перетаскивания треков.
    </footer>

    <script>
        // Clean and correct default datasets
        const defaultArtists = [
            {
                "id": "art_metallica",
                "name": "Metallica",
                "image": "https://upload.wikimedia.org/wikipedia/commons/b/b7/Metallica_logo.png"
            },
            {
                "id": "art_tool",
                "name": "Tool",
                "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Tool_Band_Logo.svg/1200px-Tool_Band_Logo.svg.png"
            },
            {
                "id": "art_slipknot",
                "name": "Slipknot",
                "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Slipknot_logo.svg/1200px-Slipknot_logo.svg.png"
            },
            {
                "id": "art_1789750335619",
                "name": "Slayer",
                "image": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4cbvHuMITD6tpppUnwCf1XyKugkERoxhGZ6IiaSsKxw&s=10"
            }
        ];

        const defaultAlbums = [
            {
                "id": "alb_m1",
                "artistId": "art_metallica",
                "title": "Master of Puppets",
                "year": "1986",
                "cover": "https://upload.wikimedia.org/wikipedia/en/b/b2/Metallica_-_Master_of_Puppets_cover.jpg",
                "tracks": [
                    {
                        "title": "Battery",
                        "eng": "Lashing out the action, returning the reaction",
                        "rus": "Выплёскивая действия, получая реакцию"
                    },
                    {
                        "title": "Master of Puppets",
                        "eng": "End of passion play, crumbling away\nI'm your source of self-destruction",
                        "rus": "Конец спектакля страстей, всё рушится\nЯ твой источник саморазрушения"
                    },
                    {
                        "title": "Disposable Heroes",
                        "eng": "Bodies fill the fields I see, hungry heroes end...",
                        "rus": "Тела заполняют поля, которые я вижу, голодные герои заканчиваются..."
                    }
                ]
            },
            {
                "id": "alb_m2",
                "artistId": "art_metallica",
                "title": "...And Justice for All",
                "year": "1988",
                "cover": "https://upload.wikimedia.org/wikipedia/en/b/bd/Metallica_-_...And_Justice_for_All_cover.jpg",
                "tracks": [
                    {
                        "title": "Blackened",
                        "eng": "Blackened is the end, winter it will send",
                        "rus": "Почерневший конец, принесет зиму"
                    },
                    {
                        "title": "One",
                        "eng": "I can't remember anything, can't tell if this is true or dream",
                        "rus": "Ничего не помню, не пойму, явь это или сон"
                    }
                ]
            },
            {
                "id": "alb_m3",
                "artistId": "art_metallica",
                "title": "72 Seasons",
                "year": "2023",
                "cover": "https://upload.wikimedia.org/wikipedia/en/4/44/Metallica_-_72_Seasons.png",
                "tracks": [
                    {
                        "title": "72 Seasons",
                        "eng": "Feeding on the wrath of man",
                        "rus": "Питаясь человеческой яростью"
                    }
                ]
            },
            {
                "id": "alb_t1",
                "artistId": "art_tool",
                "title": "Lateralus",
                "year": "2001",
                "cover": "https://upload.wikimedia.org/wikipedia/en/6/63/Tool_-_Lateralus.jpg",
                "tracks": [
                    {
                        "title": "Schism",
                        "eng": "I know the pieces fit 'cause I watched them fall away",
                        "rus": "Я знаю, элементы подходят, ведь я видел, как они отпадали"
                    },
                    {
                        "title": "Lateralus",
                        "eng": "Black then white are all I see in my infancy",
                        "rus": "Черное, затем белое — все, что я вижу в своем младенчестве"
                    }
                ]
            },
            {
                "id": "alb_1789750484122",
                "artistId": "art_1789750335619",
                "title": "Reign in Blood",
                "year": "1986",
                "cover": "https://m.media-amazon.com/images/I/61RPpNxysnL._UF1000,1000_QL80_.jpg",
                "tracks": [
                    {
                        "title": "Raining Blood",
                        "eng": "Trapped in purgatory\nA lifeless object, alive...",
                        "rus": "В ловушке чистилища\nБезжизненный предмет, живой..."
                    }
                ]
            }
        ];

        let artists = [];
        let albums = [];
        let currentArtistId = null;
        let currentAlbumId = null;

        function loadStorageData() {
            try {
                const storedArtists = localStorage.getItem('music_artists');
                const storedAlbums = localStorage.getItem('music_albums');
                
                artists = storedArtists ? JSON.parse(storedArtists) : defaultArtists;
                albums = storedAlbums ? JSON.parse(storedAlbums) : defaultAlbums;

                if (!artists || !artists.length) artists = [...defaultArtists];
                if (!albums || !albums.length) albums = [...defaultAlbums];
            } catch(e) {
                console.error("Storage parse error, fallback to defaults", e);
                artists = [...defaultArtists];
                albums = [...defaultAlbums];
            }
            saveStorageData();
        }

        function saveStorageData() {
            localStorage.setItem('music_artists', JSON.stringify(artists));
            localStorage.setItem('music_albums', JSON.stringify(albums));
        }

        function showArtistList() {
            currentArtistId = null;
            currentAlbumId = null;
            document.getElementById('breadcrumb').innerHTML = '';
            
            const container = document.getElementById('artistsView');
            document.getElementById('albumsView').classList.add('hidden');
            document.getElementById('tracksView').classList.add('hidden');
            container.classList.remove('hidden');

            let html = `
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold text-white">Исполнители</h1>
                    <span class="text-xs text-gray-400">Всего: ${artists.length}</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            `;

            artists.forEach(artist => {
                const artistAlbums = albums.filter(a => a.artistId === artist.id);
                html += `
                    <div onclick="showAlbumsView('${artist.id}')" class="bg-[#161b22] border border-[#30363d] hover:border-blue-500/50 rounded-xl p-4 cursor-pointer transition transform hover:-translate-y-1 shadow-md group">
                        <div class="aspect-square w-full rounded-lg bg-[#0d1117] mb-3 overflow-hidden border border-[#30363d]">
                            <img src="${artist.image}" alt="${artist.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/300x300/161b22/c9d1d9?text=${encodeURIComponent(artist.name)}'">
                        </div>
                        <h3 class="font-bold text-white group-hover:text-blue-400 transition truncate">${artist.name}</h3>
                        <p class="text-xs text-gray-400 mt-1">${artistAlbums.length} альбомов</p>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function showAlbumsView(artistId) {
            currentArtistId = artistId;
            currentAlbumId = null;

            const artist = artists.find(a => a.id === artistId);
            if(!artist) return showArtistList();

            document.getElementById('breadcrumb').innerHTML = `<i class="fa-solid fa-chevron-right text-xs mx-1"></i> <span class="text-white">${artist.name}</span>`;

            const container = document.getElementById('albumsView');
            document.getElementById('artistsView').classList.add('hidden');
            document.getElementById('tracksView').classList.add('hidden');
            container.classList.remove('hidden');

            const artistAlbums = albums.filter(a => a.artistId === artistId);

            let html = `
                <div class="flex items-center gap-4 bg-[#161b22] p-4 rounded-xl border border-[#30363d]">
                    <img src="${artist.image}" class="w-16 h-16 rounded-full object-cover border border-[#30363d]" onerror="this.src='https://placehold.co/100x100/161b22/c9d1d9?text=${encodeURIComponent(artist.name)}'">
                    <div>
                        <h1 class="text-2xl font-bold text-white">${artist.name}</h1>
                        <p class="text-xs text-gray-400">Дискография (${artistAlbums.length} альбомов)</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            `;

            artistAlbums.forEach(album => {
                html += `
                    <div onclick="showTracksView('${album.id}')" class="bg-[#161b22] border border-[#30363d] hover:border-blue-500/50 rounded-xl p-4 cursor-pointer transition transform hover:-translate-y-1 shadow-md group">
                        <div class="aspect-square w-full rounded-lg bg-[#0d1117] mb-3 overflow-hidden border border-[#30363d]">
                            <img src="${album.cover}" alt="${album.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/300x300/161b22/c9d1d9?text=${encodeURIComponent(album.title)}'">
                        </div>
                        <h3 class="font-bold text-white group-hover:text-blue-400 transition truncate">${album.title}</h3>
                        <p class="text-xs text-gray-400 mt-1">${album.year} • ${album.tracks ? album.tracks.length : 0} треков</p>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function showTracksView(albumId) {
            currentAlbumId = albumId;
            const album = albums.find(a => a.id === albumId);
            if(!album) return showArtistList();

            const artist = artists.find(a => a.id === album.artistId);

            document.getElementById('breadcrumb').innerHTML = `
                <i class="fa-solid fa-chevron-right text-xs mx-1"></i> 
                <button onclick="showAlbumsView('${artist.id}')" class="hover:underline">${artist.name}</button> 
                <i class="fa-solid fa-chevron-right text-xs mx-1"></i> 
                <span class="text-white">${album.title}</span>
            `;

            const container = document.getElementById('tracksView');
            document.getElementById('artistsView').classList.add('hidden');
            document.getElementById('albumsView').classList.add('hidden');
            container.classList.remove('hidden');

            renderTracklist();
        }

        function renderTracklist() {
            const album = albums.find(a => a.id === currentAlbumId);
            const artist = artists.find(a => a.id === album.artistId);
            const container = document.getElementById('tracksView');

            let html = `
                <div class="flex flex-wrap md:flex-nowrap gap-6 bg-[#161b22] p-6 rounded-xl border border-[#30363d] items-center">
                    <img src="${album.cover}" class="w-32 h-32 md:w-40 md:h-40 rounded-lg object-cover border border-[#30363d] shadow-lg shrink-0" onerror="this.src='https://placehold.co/300x300/161b22/c9d1d9?text=${encodeURIComponent(album.title)}'">
                    <div class="space-y-2">
                        <span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs rounded-full font-medium">${artist.name}</span>
                        <h1 class="text-3xl font-extrabold text-white">${album.title}</h1>
                        <p class="text-sm text-gray-400">${album.year} • ${album.tracks ? album.tracks.length : 0} пес. • <span class="text-blue-400"><i class="fa-solid fa-hand-pointer text-xs"></i> Перетаскивайте мышкой для изменения порядка</span></p>
                    </div>
                </div>

                <div class="space-y-3">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-ol text-blue-400"></i> Список треков
                    </h2>
                    <div id="dragTrackList" class="space-y-2">
            `;

            if(!album.tracks || album.tracks.length === 0) {
                html += `<div class="p-8 text-center text-gray-500 bg-[#161b22] rounded-xl border border-[#30363d]">В этом альбоме пока нет треков.</div>`;
            } else {
                album.tracks.forEach((track, index) => {
                    html += `
                        <div draggable="true" 
                             data-index="${index}" 
                             class="draggable-item bg-[#161b22] border border-[#30363d] hover:border-[#484f58] rounded-xl p-4 transition shadow-sm space-y-3">
                            
                            <div class="flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3 min-w-0">
                                    <i class="fa-solid fa-grip-vertical text-gray-600 hover:text-gray-300 text-sm"></i>
                                    <span class="w-6 text-center text-xs font-bold text-gray-500 bg-[#0d1117] py-1 rounded border border-[#30363d]">${index + 1}</span>
                                    <h3 class="font-bold text-white text-base truncate">${track.title}</h3>
                                </div>
                                
                                <div class="flex items-center gap-1 shrink-0">
                                    <button onclick="moveTrack(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30 p-1.5 text-gray-500"' : 'class="p-1.5 text-gray-400 hover:text-white hover:bg-[#21262d] rounded transition"'} title="Вверх">
                                        <i class="fa-solid fa-arrow-up text-xs"></i>
                                    </button>
                                    <button onclick="moveTrack(${index}, 1)" ${index === album.tracks.length - 1 ? 'disabled class="opacity-30 p-1.5 text-gray-500"' : 'class="p-1.5 text-gray-400 hover:text-white hover:bg-[#21262d] rounded transition"'} title="Вниз">
                                        <i class="fa-solid fa-arrow-down text-xs"></i>
                                    </button>
                                    <button onclick="deleteTrack(${index})" class="p-1.5 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded transition ml-2" title="Удалить песню">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>

                            ${(track.eng || track.rus) ? `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-[#30363d]/50 text-xs font-mono">
                                    <div class="bg-[#0d1117] p-3 rounded-lg border border-[#30363d] whitespace-pre-wrap text-gray-300">${track.eng || '—'}</div>
                                    <div class="bg-[#0d1117] p-3 rounded-lg border border-[#30363d] whitespace-pre-wrap text-gray-300">${track.rus || '—'}</div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
            attachDragAndDropHandlers();
        }

        let dragSrcIndex = null;

        function attachDragAndDropHandlers() {
            const items = document.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('dragleave', handleDragLeave);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
            });
        }

        function handleDragStart(e) {
            dragSrcIndex = parseInt(this.getAttribute('data-index'));
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            this.classList.add('drag-over');
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            const targetIndex = parseInt(this.getAttribute('data-index'));

            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                const album = albums.find(a => a.id === currentAlbumId);
                const movedTrack = album.tracks.splice(dragSrcIndex, 1)[0];
                album.tracks.splice(targetIndex, 0, movedTrack);
                
                saveStorageData();
                renderTracklist();
            }
            return false;
        }

        function handleDragEnd(e) {
            const items = document.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.classList.remove('dragging', 'drag-over');
            });
        }

        // Reorder via Up/Down buttons
        function moveTrack(index, direction) {
            const album = albums.find(a => a.id === currentAlbumId);
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= album.tracks.length) return;

            const temp = album.tracks[index];
            album.tracks[index] = album.tracks[newIndex];
            album.tracks[newIndex] = temp;

            saveStorageData();
            renderTracklist();
        }

        function deleteTrack(index) {
            if (!confirm("Удалить эту песню?")) return;
            const album = albums.find(a => a.id === currentAlbumId);
            album.tracks.splice(index, 1);
            saveStorageData();
            renderTracklist();
        }

        function closeModals() {
            document.getElementById('artistModal').classList.add('hidden');
            document.getElementById('albumModal').classList.add('hidden');
            document.getElementById('trackModal').classList.add('hidden');
        }

        function openArtistModal() {
            document.getElementById('artistModal').classList.remove('hidden');
        }

        function openAlbumModal() {
            const select = document.getElementById('albumArtistSelect');
            select.innerHTML = artists.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            if (currentArtistId) select.value = currentArtistId;
            document.getElementById('albumModal').classList.remove('hidden');
        }

        function openTrackModal() {
            const select = document.getElementById('trackAlbumSelect');
            select.innerHTML = albums.map(a => `<option value="${a.id}">${a.title}</option>`).join('');
            if (currentAlbumId) select.value = currentAlbumId;
            document.getElementById('trackModal').classList.remove('hidden');
        }

        function saveArtist(e) {
            e.preventDefault();
            const name = document.getElementById('artistNameInput').value;
            const image = document.getElementById('artistImageInput').value;
            
            artists.push({
                id: 'art_' + Date.now(),
                name,
                image
            });
            saveStorageData();
            closeModals();
            showArtistList();
        }

        function saveAlbum(e) {
            e.preventDefault();
            const artistId = document.getElementById('albumArtistSelect').value;
            const title = document.getElementById('albumTitleInput').value;
            const year = document.getElementById('albumYearInput').value;
            const cover = document.getElementById('albumCoverInput').value;

            albums.push({
                id: 'alb_' + Date.now(),
                artistId,
                title,
                year,
                cover,
                tracks: []
            });
            saveStorageData();
            closeModals();
            showAlbumsView(artistId);
        }

        function saveTrack(e) {
            e.preventDefault();
            const albumId = document.getElementById('trackAlbumSelect').value;
            const title = document.getElementById('trackTitleInput').value;
            const eng = document.getElementById('trackEngInput').value;
            const rus = document.getElementById('trackRusInput').value;

            const album = albums.find(a => a.id === albumId);
            if (!album.tracks) album.tracks = [];

            album.tracks.push({ title, eng, rus });
            saveStorageData();
            closeModals();

            if (currentAlbumId === albumId) {
                renderTracklist();
            } else {
                showTracksView(albumId);
            }
        }

        // Export/Import JSON Data
        function exportData() {
            const data = { artists, albums };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "music_data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.artists && parsed.albums) {
                        artists = parsed.artists;
                        albums = parsed.albums;
                        saveStorageData();
                        showArtistList();
                    } else {
                        alert("Неверная структура файла JSON.");
                    }
                } catch(err) {
                    alert("Ошибка чтения JSON файла.");
                }
            };
            reader.readAsText(file);
        }

        // Initialize App on load
        window.onload = function() {
            loadStorageData();
            showArtistList();
        };
    </script>
</body>
</html>
