<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics App - Музыкальная Библиотека</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #1f6feb;
      --accent-hover: #388bfd;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --danger: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .nav-left, .nav-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      background-color: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      border-color: #8b949e;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: rgba(240, 246, 252, 0.1);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: #21262d;
      color: #f85149;
      border-color: var(--border-color);
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 12px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 15px;
      color: var(--text-muted);
    }

    .breadcrumbs span {
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
    }

    .breadcrumbs span:hover {
      text-decoration: underline;
    }

    .album-header-info {
      display: flex;
      gap: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      align-items: center;
    }

    .album-header-info img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }

    .track-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.2s;
    }

    .track-item:hover {
      border-color: #8b949e;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .track-drag-handle {
      cursor: grab;
      color: var(--text-muted);
      user-select: none;
      font-size: 18px;
    }

    .track-number {
      color: var(--text-muted);
      font-size: 14px;
      min-width: 24px;
    }

    .track-title {
      font-weight: 600;
      font-size: 16px;
    }

    .track-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .song-lyrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 650px) {
      .song-lyrics-grid {
        grid-template-columns: 1fr;
      }
    }

    .lyrics-box {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 380px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-control {
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 220px;
      font-family: monospace;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="nav-left">
      <button class="btn" onclick="showArtists()"><span class="icon">🏠</span> Исполнители</button>
    </div>
    <div class="nav-right">
      <button class="btn" onclick="exportData()"><span class="icon">💾</span> Скачать данные</button>
      <button class="btn" onclick="document.getElementById('importFile').click()"><span class="icon">📁</span> Загрузить данные</button>
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
      <button class="btn btn-primary" onclick="openArtistModal()"><span class="icon">+</span> Добавить исполнителя</button>
      <button class="btn btn-primary" onclick="openAlbumModal()"><span class="icon">+</span> Добавить альбом</button>
      <button class="btn btn-primary" id="addTrackBtn" onclick="openTrackModal()" style="display:none;"><span class="icon">+</span> Добавить песню</button>
    </div>
  </header>

  <main id="appContent"></main>
</div>

<!-- Modal: View Song Window -->
<div id="songModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="songModalTitle">Название песни</div>
        <p style="font-size: 13px; color: var(--text-muted);" id="songModalSubtitle">Исполнитель - Альбом</p>
      </div>
      <button class="btn btn-sm" onclick="closeSongModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="song-lyrics-grid">
        <div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;">ОРИГИНАЛ (ENGLISH)</div>
          <div class="lyrics-box" id="songModalEng"></div>
        </div>
        <div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;">ПЕРЕВОД (РУССКИЙ)</div>
          <div class="lyrics-box" id="songModalRus"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="editSongFromViewBtn">✏️ Редактировать</button>
      <button class="btn btn-primary" onclick="closeSongModal()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Artist -->
<div id="artistModal" class="modal-overlay hidden">
  <div class="modal" style="max-width: 450px;">
    <div class="modal-header">
      <div class="modal-title" id="artistModalTitle">Добавить исполнителя</div>
      <button class="btn btn-sm" onclick="closeModal('artistModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="artistEditId">
      <div class="form-group">
        <label>Имя исполнителя / Группы</label>
        <input type="text" id="artistNameInput" class="form-control" placeholder="Например: Metallica">
      </div>
      <div class="form-group">
        <label>Ссылка на логотип / фото (URL)</label>
        <input type="text" id="artistImageInput" class="form-control" placeholder="https://...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('artistModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveArtist()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Album -->
<div id="albumModal" class="modal-overlay hidden">
  <div class="modal" style="max-width: 450px;">
    <div class="modal-header">
      <div class="modal-title" id="albumModalTitle">Добавить альбом</div>
      <button class="btn btn-sm" onclick="closeModal('albumModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="albumEditId">
      <div class="form-group">
        <label>Исполнитель</label>
        <select id="albumArtistSelect" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>Название альбома</label>
        <input type="text" id="albumTitleInput" class="form-control" placeholder="Например: Master of Puppets">
      </div>
      <div class="form-group">
        <label>Год выпуска</label>
        <input type="text" id="albumYearInput" class="form-control" placeholder="1986">
      </div>
      <div class="form-group">
        <label>Ссылка на обложку (URL)</label>
        <input type="text" id="albumCoverInput" class="form-control" placeholder="https://...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('albumModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveAlbum()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Track -->
<div id="trackModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="trackModalTitle">Добавить песню</div>
      <button class="btn btn-sm" onclick="closeModal('trackModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="trackEditIndex" value="-1">
      <div class="form-group">
        <label>Название песни</label>
        <input type="text" id="trackTitleInput" class="form-control" placeholder="Например: Battery">
      </div>
      
      <div style="text-align: center; margin: 4px 0;">
        <button type="button" class="btn btn-primary" id="autoTranslateBtn" onclick="autoTranslateTrack()" style="width: 100%;">
          🌐 Автоперевод (English ➔ Русский)
        </button>
      </div>

      <div class="song-lyrics-grid">
        <div class="form-group">
          <label>Оригинальный текст (English)</label>
          <textarea id="trackEngInput" class="form-control" placeholder="Текст песни на английском..."></textarea>
        </div>
        <div class="form-group">
          <label>Перевод текста (Русский)</label>
          <textarea id="trackRusInput" class="form-control" placeholder="Перевод текста на русский..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('trackModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveTrack()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const defaultArtists = [
    {
      "id": "art_metallica",
      "name": "Metallica",
      "image": "https://upload.wikimedia.org/wikipedia/commons/b/b7/Metallica_logo.png"
    },
    {
      "id": "art_tool",
      "name": "Tool",
      "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Tool_Band_Logo.svg/1200px-Tool_Band_Logo.svg.png"
    },
    {
      "id": "art_slipknot",
      "name": "Slipknot",
      "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Slipknot_logo.svg/1200px-Slipknot_logo.svg.png"
    },
    {
      "id": "art_1789750335619",
      "name": "Slayer",
      "image": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4cbvHuMITD6tpppUnwCf1XyKugkERoxhGZ6IiaSsKxw&s=10"
    }
  ];

  const defaultAlbums = [
    {
      "id": "alb_m1",
      "artistId": "art_metallica",
      "title": "Master of Puppets",
      "year": "1986",
      "cover": "https://upload.wikimedia.org/wikipedia/en/b/b2/Metallica_-_Master_of_Puppets_cover.jpg",
      "tracks": [
        {
          "title": "Battery",
          "eng": "Lashing out the action, returning the reaction\nWeak are ripped and torn away\nHypnotizing power, crushing all that cower\nBattery is here to stay",
          "rus": "Выплёскивая действия, получая реакцию\nСлабые вырваны и разорваны\nГипнотизирующая сила, крушащая всех, кто сжимается\nБатарея здесь навсегда"
        },
        {
          "title": "Master of Puppets",
          "eng": "End of passion play, crumbling away\nI'm your source of self-destruction",
          "rus": "Конец спектакля страстей, всё рушится\nЯ твой источник саморазрушения"
        },
        {
          "title": "Disposable Heroes",
          "eng": "Bodies fill the fields I see, hungry heroes end\nNo one to play soldier now, no one to pretend",
          "rus": "Тела заполняют поля, которые я вижу, голодные герои заканчиваются\nТеперь некому играть в солдата, некому притворяться"
        }
      ]
    },
    {
      "id": "alb_m2",
      "artistId": "art_metallica",
      "title": "...And Justice for All",
      "year": "1988",
      "cover": "https://upload.wikimedia.org/wikipedia/en/b/bd/Metallica_-_...And_Justice_for_All_cover.jpg",
      "tracks": [
        {
          "title": "Blackened",
          "eng": "Blackened is the end, winter it will send",
          "rus": "Почерневший конец, принесет зиму"
        },
        {
          "title": "One",
          "eng": "I can't remember anything, can't tell if this is true or dream",
          "rus": "Ничего не помню, не пойму, явь это или сон"
        }
      ]
    },
    {
      "id": "alb_1789750484122",
      "artistId": "art_1789750335619",
      "title": "Reign in Blood",
      "year": "1986",
      "cover": "https://m.media-amazon.com/images/I/61RPpNxysnL._UF1000,1000_QL80_.jpg",
      "tracks": [
        {
          "title": "Raining Blood",
          "eng": "Trapped in purgatory\nA lifeless object, alive\nAwaiting reprisal",
          "rus": "В ловушке чистилища\nБезжизненный предмет, живой\nОжидание расправы"
        }
      ]
    }
  ];

  let artists = JSON.parse(localStorage.getItem('music_artists')) || defaultArtists;
  let albums = JSON.parse(localStorage.getItem('music_albums')) || defaultAlbums;
  let currentArtistId = null;
  let currentAlbumId = null;
  let dragSrcIndex = null;

  function saveData() {
    localStorage.setItem('music_artists', JSON.stringify(artists));
    localStorage.setItem('music_albums', JSON.stringify(albums));
  }

  function showArtists() {
    currentArtistId = null;
    currentAlbumId = null;
    document.getElementById('addTrackBtn').style.display = 'none';

    const app = document.getElementById('appContent');
    app.innerHTML = `
      <h2 class="section-title">Исполнители</h2>
      <div class="grid">
        ${artists.map(art => `
          <div class="card" onclick="showAlbums('${art.id}')">
            <div class="card-actions">
              <button class="btn btn-sm" onclick="event.stopPropagation(); openArtistModal('${art.id}')">✏️</button>
              <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteArtist('${art.id}')">🗑️</button>
            </div>
            <img src="${art.image \vert{}\vert{} 'https://via.placeholder.com/200'}" alt="${art.name}">
            <h3>${art.name}</h3>
          </div>
        `).join('')}
      </div>
    `;
  }

  function showAlbums(artistId) {
    currentArtistId = artistId;
    currentAlbumId = null;
    document.getElementById('addTrackBtn').style.display = 'none';

    const artist = artists.find(a => a.id === artistId);
    if (!artist) return showArtists();

    const artistAlbums = albums.filter(a => a.artistId === artistId);
    const app = document.getElementById('appContent');

    app.innerHTML = `
      <div class="breadcrumbs">
        <span onclick="showArtists()">Исполнители</span> /
        <span>${artist.name}</span>
      </div>
      <h2 class="section-title">Альбомы: ${artist.name}</h2>
      <div class="grid">
        ${artistAlbums.map(alb => `
          <div class="card" onclick="showTracks('${alb.id}')">
            <div class="card-actions">
              <button class="btn btn-sm" onclick="event.stopPropagation(); openAlbumModal('${alb.id}')">✏️</button>
              <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteAlbum('${alb.id}')">🗑️</button>
            </div>
            <img src="${alb.cover \vert{}\vert{} 'https://via.placeholder.com/200'}" alt="${alb.title}">
            <h3>${alb.title}</h3>
            <p>${alb.year || ''}</p>
          </div>
        `).join('')}
      </div>
    `;
  }

  function showTracks(albumId) {
    currentAlbumId = albumId;
    const album = albums.find(a => a.id === albumId);
    if (!album) return showArtists();

    currentArtistId = album.artistId;
    const artist = artists.find(a => a.id === currentArtistId);
    const artistName = artist ? artist.name : '';

    document.getElementById('addTrackBtn').style.display = 'inline-flex';

    const app = document.getElementById('appContent');
    app.innerHTML = `
      <div class="breadcrumbs">
        <span onclick="showArtists()">Исполнители</span> /
        <span onclick="showAlbums('${artist ? artist.id : ''}')">${artistName}</span> /
        <span>${album.title}</span>
      </div>

      <div class="album-header-info">
        <img src="${album.cover || 'https://via.placeholder.com/200'}" alt="${album.title}">
        <div>
          <h2>${album.title}</h2>
          <p style="color: var(--text-muted); margin-top: 4px;">${artistName} • ${album.year || ''}</p>
          <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">Всего треков: ${album.tracks ? album.tracks.length : 0}</p>
        </div>
      </div>

      <ul class="track-list" id="trackListContainer">
        ${(album.tracks || []).map((track, idx) => `
          <li class="track-item" draggable="true" ondragstart="handleDragStart(event, ${idx})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${idx})">
            <div class="track-info" onclick="openSongModal(${idx})">
              <span class="track-drag-handle">≡</span>
              <span class="track-number">${idx + 1}.</span>
              <span class="track-title">${track.title}</span>
            </div>
            <div class="track-item-actions">
              <button class="btn btn-sm" onclick="moveTrack(${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>↑</button>
              <button class="btn btn-sm" onclick="moveTrack(${idx}, 1)" ${idx === album.tracks.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>↓</button>
              <button class="btn btn-sm" onclick="openTrackModal(${idx})">✏️</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTrack(${idx})">🗑️</button>
            </div>
          </li>
        `).join('')}
      </ul>
    `;
  }

  function openSongModal(trackIndex) {
    const album = albums.find(a => a.id === currentAlbumId);
    if (!album || !album.tracks || !album.tracks[trackIndex]) return;

    const track = album.tracks[trackIndex];
    const artist = artists.find(a => a.id === album.artistId);

    document.getElementById('songModalTitle').textContent = track.title;
    document.getElementById('songModalSubtitle').textContent = `${artist ? artist.name : ''} — ${album.title}`;
    document.getElementById('songModalEng').textContent = track.eng || '(Текст отсутствует)';
    document.getElementById('songModalRus').textContent = track.rus || '(Перевод отсутствует)';

    document.getElementById('editSongFromViewBtn').onclick = function() {
      closeSongModal();
      openTrackModal(trackIndex);
    };

    document.getElementById('songModal').classList.remove('hidden');
  }

  function closeSongModal() {
    document.getElementById('songModal').classList.add('hidden');
  }

  function handleDragStart(e, index) {
    dragSrcIndex = index;
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    if (e.preventDefault) e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    return false;
  }

  function handleDrop(e, index) {
    if (e.stopPropagation) e.stopPropagation();
    if (dragSrcIndex !== null && dragSrcIndex !== index) {
      const album = albums.find(a => a.id === currentAlbumId);
      if (album && album.tracks) {
        const movedItem = album.tracks.splice(dragSrcIndex, 1)[0];
        album.tracks.splice(index, 0, movedItem);
        saveData();
        showTracks(currentAlbumId);
      }
    }
    return false;
  }

  function moveTrack(index, direction) {
    const album = albums.find(a => a.id === currentAlbumId);
    if (!album || !album.tracks) return;

    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= album.tracks.length) return;

    const temp = album.tracks[index];
    album.tracks[index] = album.tracks[newIndex];
    album.tracks[newIndex] = temp;

    saveData();
    showTracks(currentAlbumId);
  }

  async function autoTranslateTrack() {
    const engText = document.getElementById('trackEngInput').value.trim();
    if (!engText) {
      alert('Пожалуйста, введите текст на английском для перевода!');
      return;
    }

    const btn = document.getElementById('autoTranslateBtn');
    const originalBtnText = btn.textContent;
    btn.textContent = '⌛ Переводим...';
    btn.disabled = true;

    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(engText)}`;
      const res = await fetch(url);
      const data = await res.json();

      let translated = '';
      if (data && data[0]) {
        translated = data[0].map(item => item[0]).join('');
      }

      if (translated) {
        document.getElementById('trackRusInput').value = translated;
      } else {
        alert('Не удалось автоматически перевести текст.');
      }
    } catch (err) {
      alert('Ошибка при вызове автоперевода: ' + err.message);
    } finally {
      btn.textContent = originalBtnText;
      btn.disabled = false;
    }
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
  }

  function openArtistModal(artistId = null) {
    document.getElementById('artistEditId').value = artistId || '';
    if (artistId) {
      const art = artists.find(a => a.id === artistId);
      document.getElementById('artistModalTitle').textContent = 'Редактировать исполнителя';
      document.getElementById('artistNameInput').value = art ? art.name : '';
      document.getElementById('artistImageInput').value = art ? art.image || '' : '';
    } else {
      document.getElementById('artistModalTitle').textContent = 'Добавить исполнителя';
      document.getElementById('artistNameInput').value = '';
      document.getElementById('artistImageInput').value = '';
    }
    document.getElementById('artistModal').classList.remove('hidden');
  }

  function saveArtist() {
    const id = document.getElementById('artistEditId').value;
    const name = document.getElementById('artistNameInput').value.trim();
    const image = document.getElementById('artistImageInput').value.trim();

    if (!name) return alert('Введите имя исполнителя');

    if (id) {
      const art = artists.find(a => a.id === id);
      if (art) { art.name = name; art.image = image; }
    } else {
      artists.push({ id: 'art_' + Date.now(), name, image });
    }

    saveData();
    closeModal('artistModal');
    if (currentArtistId) showAlbums(currentArtistId); else showArtists();
  }

  function deleteArtist(id) {
    if (!confirm('Удалить исполнителя и все его альбомы?')) return;
    artists = artists.filter(a => a.id !== id);
    albums = albums.filter(a => a.artistId !== id);
    saveData();
    showArtists();
  }

  function openAlbumModal(albumId = null) {
    const select = document.getElementById('albumArtistSelect');
    select.innerHTML = artists.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

    document.getElementById('albumEditId').value = albumId || '';
    if (albumId) {
      const alb = albums.find(a => a.id === albumId);
      document.getElementById('albumModalTitle').textContent = 'Редактировать альбом';
      select.value = alb ? alb.artistId : '';
      document.getElementById('albumTitleInput').value = alb ? alb.title : '';
      document.getElementById('albumYearInput').value = alb ? alb.year || '' : '';
      document.getElementById('albumCoverInput').value = alb ? alb.cover || '' : '';
    } else {
      document.getElementById('albumModalTitle').textContent = 'Добавить альбом';
      if (currentArtistId) select.value = currentArtistId;
      document.getElementById('albumTitleInput').value = '';
      document.getElementById('albumYearInput').value = '';
      document.getElementById('albumCoverInput').value = '';
    }
    document.getElementById('albumModal').classList.remove('hidden');
  }

  function saveAlbum() {
    const id = document.getElementById('albumEditId').value;
    const artistId = document.getElementById('albumArtistSelect').value;
    const title = document.getElementById('albumTitleInput').value.trim();
    const year = document.getElementById('albumYearInput').value.trim();
    const cover = document.getElementById('albumCoverInput').value.trim();

    if (!title) return alert('Введите название альбома');

    if (id) {
      const alb = albums.find(a => a.id === id);
      if (alb) {
        alb.artistId = artistId;
        alb.title = title;
        alb.year = year;
        alb.cover = cover;
      }
    } else {
      albums.push({ id: 'alb_' + Date.now(), artistId, title, year, cover, tracks: [] });
    }

    saveData();
    closeModal('albumModal');
    if (currentAlbumId) showTracks(currentAlbumId); else if (currentArtistId) showAlbums(currentArtistId); else showArtists();
  }

  function deleteAlbum(id) {
    if (!confirm('Удалить альбом и все его песни?')) return;
    albums = albums.filter(a => a.id !== id);
    saveData();
    if (currentArtistId) showAlbums(currentArtistId); else showArtists();
  }

  function openTrackModal(trackIndex = -1) {
    document.getElementById('trackEditIndex').value = trackIndex;
    const album = albums.find(a => a.id === currentAlbumId);

    if (trackIndex >= 0 && album && album.tracks[trackIndex]) {
      const trk = album.tracks[trackIndex];
      document.getElementById('trackModalTitle').textContent = 'Редактировать песню';
      document.getElementById('trackTitleInput').value = trk.title;
      document.getElementById('trackEngInput').value = trk.eng || '';
      document.getElementById('trackRusInput').value = trk.rus || '';
    } else {
      document.getElementById('trackModalTitle').textContent = 'Добавить песню';
      document.getElementById('trackTitleInput').value = '';
      document.getElementById('trackEngInput').value = '';
      document.getElementById('trackRusInput').value = '';
    }
    document.getElementById('trackModal').classList.remove('hidden');
  }

  function saveTrack() {
    const index = parseInt(document.getElementById('trackEditIndex').value, 10);
    const title = document.getElementById('trackTitleInput').value.trim();
    const eng = document.getElementById('trackEngInput').value;
    const rus = document.getElementById('trackRusInput').value;

    if (!title) return alert('Введите название песни');

    const album = albums.find(a => a.id === currentAlbumId);
    if (!album) return;

    if (!album.tracks) album.tracks = [];

    if (index >= 0) {
      album.tracks[index] = { title, eng, rus };
    } else {
      album.tracks.push({ title, eng, rus });
    }

    saveData();
    closeModal('trackModal');
    showTracks(currentAlbumId);
  }

  function deleteTrack(index) {
    if (!confirm('Удалить песню?')) return;
    const album = albums.find(a => a.id === currentAlbumId);
    if (album && album.tracks) {
      album.tracks.splice(index, 1);
      saveData();
      showTracks(currentAlbumId);
    }
  }

  function exportData() {
    const data = { artists, albums };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lyrics_library_backup.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.artists && parsed.albums) {
          artists = parsed.artists;
          albums = parsed.albums;
          saveData();
          showArtists();
          alert('Данные успешно загружены!');
        } else {
          alert('Неверный формат файла JSON!');
        }
      } catch (err) {
        alert('Ошибка при чтении файла JSON');
      }
    };
    reader.readAsText(file);
  }

  showArtists();
</script>
